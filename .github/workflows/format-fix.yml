name: One-off CI fix

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # 与 build.yml 的 checks 作业使用同一个 Flutter/Dart 版本，避免格式化版本不一致。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # 不装依赖时 analysis_options.yaml 无法解析 flutter_lints，dart analyze 会报上万条假错误。
      - name: Install Dart dependencies
        run: flutter pub get --enforce-lockfile

      # 修复 dart analyze 的 curly_braces_in_flow_control_structures 报错。
      - name: Fix curly-braces lint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/ui/player/audio_player_page.dart')
          text = path.read_text(encoding='utf-8')
          old = "                      if (index != session.index) unawaited(session.play(index));"
          new = "\n".join([
              "                      if (index != session.index) {",
              "                        unawaited(session.play(index));",
              "                      }",
          ])
          if text.count(old) == 1:
              path.write_text(text.replace(old, new), encoding='utf-8')
              print('fixed: audio_player_page.dart if block')
          elif new in text:
              print('already fixed: audio_player_page.dart if block')
          else:
              raise SystemExit('audio_player_page.dart: unexpected lint statement')
          PY

      # ONLY_HONGGUO=true 下不可用的站源不在 SourceSite.values 中，但站源顺序包含全部已安装站源。
      - name: Fix source order test for ONLY_HONGGUO
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/local_store_test.dart')
          text = path.read_text(encoding='utf-8')
          count = text.count('SourceSite.values')
          if count:
              path.write_text(text.replace('SourceSite.values', 'SourceSite.allValues'), encoding='utf-8')
              print(f'fixed: {count} SourceSite.values -> SourceSite.allValues')
          elif 'SourceSite.allValues' in text:
              print('already fixed: source order test')
          else:
              raise SystemExit('local_store_test.dart: no source order assertions found')
          PY

      - name: Format Dart files
        run: dart format lib test

      # 提交前自校验：格式、静态分析、ONLY_HONGGUO 场景测试。
      - name: Verify checks
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos lib test
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ONLY_HONGGUO=true

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes needed."
            exit 0
          fi

          git add lib test
          git commit -m "ci: fix format, lint and ONLY_HONGGUO test"

          BRANCH="ci-fix-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git push origin "HEAD:$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "ci: fix format, lint and ONLY_HONGGUO test" \
            --body "Generated by format-fix.yml from CI log 124320775703."
