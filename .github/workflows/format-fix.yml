name: One-off Dart format fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # 与 build.yml 的 checks 使用同一个版本，确保格式化结果一致。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # 仅用于消除 analysis_options.yaml 的依赖解析警告，不改变代码。
      - name: Install Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format Dart files
        run: dart format lib test

      # 直接推 main，不创建 PR，避免 Actions 无 PR 创建权限导致失败。
      - name: Commit formatted files
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format dart files"
          git push origin HEAD:main
