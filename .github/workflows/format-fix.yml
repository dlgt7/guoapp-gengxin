name: One-off Dart format fix

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Format Dart files
        run: dart format lib test

      - name: Commit formatted files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No formatting changes needed."
            exit 0
          fi

          git add lib test
          git commit -m "style: format dart files"

          if git push origin HEAD:main; then
            echo "Pushed formatted files directly to main."
            exit 0
          fi

          echo "Direct push to main was rejected; opening a pull request instead."
          BRANCH="format-fix-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git push origin "HEAD:$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "style: format dart files" \
            --body "Automatically generated by dart format lib test."
